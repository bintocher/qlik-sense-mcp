[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlik-sense-mcp-server"
version = "2.4.0"
description = "MCP Server for Qlik Sense Enterprise APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Stanislav Chernov", email = "bintocher@yandex.com"}]
keywords = ["mcp", "qlik", "qlik-sense", "analytics", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "mcp>=1.8.0,<3.0.0",
    "httpx>=0.28",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "websocket-client>=1.9",
    "PyJWT[crypto]>=2.13",
    "cryptography>=50.0",
    # Direct dependencies of the incoming JWT gateway. Lifespan API is used
    # instead of deprecated Starlette startup/shutdown constructor hooks.
    "anyio>=4.5,<5",
    "starlette>=0.27,<1.0",
    "uvicorn>=0.31.1,<1.0; sys_platform != 'emscripten'"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "build>=1.6",
    "twine>=7.0",
    "bump-my-version>=1.5",
    "pytest>=9.0",
    "pytest-asyncio>=1.4"
]

[project.urls]
Homepage = "https://github.com/bintocher/qlik-sense-mcp"
Repository = "https://github.com/bintocher/qlik-sense-mcp"
Issues = "https://github.com/bintocher/qlik-sense-mcp/issues"

[project.scripts]
qlik-sense-mcp-server = "qlik_sense_mcp_server.cli:main"

[tool.bumpversion]
current_version = "2.4.0"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = false
message = "Bump version: {current_version} to {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "qlik_sense_mcp_server/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
