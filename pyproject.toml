[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlik-sense-mcp-server"
version = "2.3.0"
description = "MCP Server for Qlik Sense Enterprise APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Stanislav Chernov", email = "bintocher@yandex.com"}]
keywords = ["mcp", "qlik", "qlik-sense", "analytics", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    # Both SDK lines are supported: 1.x via mcp.server.fastmcp.FastMCP and
    # 2.x via mcp.server.mcpserver.MCPServer (see server.py). Capped below
    # 3.0 so the next breaking SDK release cannot break installs again.
    # Floor is 1.8.0: FastMCP.run_streamable_http_async() — the default
    # transport — first appears there (1.7.x has FastMCP but no HTTP runner,
    # and 1.1 has no FastMCP at all).
    "mcp>=1.8.0,<3.0.0",
    # Floors track the lines this release is developed and tested against.
    # They are minor-level, not pinned patches: a newer patch is always
    # welcome, an older minor is not what anyone ran.
    "httpx>=0.28",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "websocket-client>=1.9",
    "PyJWT[crypto]>=2.13",
    "cryptography>=50.0"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "build>=1.6",
    "twine>=7.0",
    # bump-my-version, not bump2version: the latter has had no release
    # since 2020 and its configuration format is frozen with it.
    "bump-my-version>=1.5",
    "pytest>=9.0",
    "pytest-asyncio>=1.4"
]

[project.urls]
Homepage = "https://github.com/bintocher/qlik-sense-mcp"
Repository = "https://github.com/bintocher/qlik-sense-mcp"
Issues = "https://github.com/bintocher/qlik-sense-mcp/issues"

[project.scripts]
qlik-sense-mcp-server = "qlik_sense_mcp_server.server:main"

[tool.bumpversion]
current_version = "2.3.0"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = false
# Plain ASCII: the default message uses an arrow character, and this
# project keeps its history to keyboard characters.
message = "Bump version: {current_version} to {new_version}"


[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "qlik_sense_mcp_server/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
